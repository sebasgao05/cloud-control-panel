AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Control Panel - Multi-account, multi-instance serverless management.
  CloudFront + S3 (frontend) + API Gateway HTTP API + Lambda (backend) + DynamoDB (config).
  Supports multiple AWS accounts via cross-account IAM roles.

Parameters:
  StackTag:
    Type: String
    Default: ccp-main
    Description: Unique tag for naming resources
  ProjectTag:
    Type: String
    Default: cloud-control-panel
    Description: Project name for cost allocation tagging
  EnvironmentTag:
    Type: String
    Default: production
    Description: Environment (production, staging, dev)
  OwnerTag:
    Type: String
    Default: platform-team
    Description: Team or person owning this stack
  CostCenterTag:
    Type: String
    Default: cloud-ops
    Description: Cost center for billing separation

Resources:
  # ─── DynamoDB: Config Store ───────────────────────────────────────────

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "cloud-control-config-${StackTag}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Component
          Value: database

  # ─── Backend: Lambda ──────────────────────────────────────────────────

  ControlFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cloud-control-lambda-${StackTag}"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Component
          Value: iam
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cloud-control-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # EC2 operations
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:DescribeInstances
                Resource: "*"
              # RDS operations
              - Effect: Allow
                Action:
                  - rds:StartDBCluster
                  - rds:StopDBCluster
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource: "*"
              # ECS operations
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeClusters
                Resource: "*"
              # Lightsail operations
              - Effect: Allow
                Action:
                  - lightsail:StartInstance
                  - lightsail:StopInstance
                  - lightsail:GetInstance
                Resource: "*"
              # AppRunner operations
              - Effect: Allow
                Action:
                  - apprunner:PauseService
                  - apprunner:ResumeService
                  - apprunner:DescribeService
                Resource: "*"
              # CloudWatch metrics
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                Resource: "*"
              # SSM for updates
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                Resource: "*"
              # Cross-account assume role
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: "arn:aws:iam::*:role/CloudControlRemoteAccess"
              # DynamoDB access
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt ConfigTable.Arn
              # EventBridge Scheduler
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                  - scheduler:ListSchedules
                  - scheduler:TagResource
                Resource: "*"
              # Pass role (for scheduler to invoke Lambda)
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt SchedulerExecutionRole.Arn

  # ─── EventBridge Scheduler Role (allows scheduler to invoke Lambda) ──

  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cloud-control-scheduler-${StackTag}"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Component
          Value: iam
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cloud-control-${StackTag}"

  ControlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cloud-control-${StackTag}"
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ControlFunctionRole.Arn
      Code: backend/
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Component
          Value: compute
      Environment:
        Variables:
          STACK_TAG: !Ref StackTag
          CONFIG_TABLE: !Ref ConfigTable
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerExecutionRole.Arn
          LAMBDA_ARN: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cloud-control-${StackTag}"
          PROJECT_TAG: !Ref ProjectTag
          ENVIRONMENT_TAG: !Ref EnvironmentTag
          OWNER_TAG: !Ref OwnerTag
          COST_CENTER_TAG: !Ref CostCenterTag

  # ─── HTTP API (API Gateway v2) ───────────────────────────────────────

  ControlApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "cloud-control-api-${StackTag}"
      ProtocolType: HTTP
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag
        Owner: !Ref OwnerTag
        CostCenter: !Ref CostCenterTag
        Component: api
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Api-Key

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ControlApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ControlFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ControlApi
      RouteKey: "$default"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ControlApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  ControlFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*"

  # ─── Frontend: S3 + CloudFront ───────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cloud-control-${StackTag}-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Component
          Value: frontend
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: Distribution
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "cloud-control-oac-${StackTag}-v2"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: CostCenter
          Value: !Ref CostCenterTag
        - Key: Component
          Value: cdn
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${ControlApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ControlPanelUrl:
    Description: URL of the Cloud Control Panel
    Value: !Sub "https://${Distribution.DomainName}"

  ApiEndpoint:
    Description: API Gateway endpoint (direct)
    Value: !Sub "https://${ControlApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  FrontendBucketName:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket

  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref Distribution

  ConfigTableName:
    Description: DynamoDB config table name
    Value: !Ref ConfigTable
