name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r backend/requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=backend --cov-report=term-missing

  # ─── Persistent Staging: deploy ccp-staging on every merge to main ───

  deploy-staging:
    name: Deploy Staging (ccp-staging)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    outputs:
      panel-url: ${{ steps.deploy.outputs.panel-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy persistent staging stack
        id: deploy
        run: |
          # Reconstruct accounts.json from secret
          echo '${{ secrets.ACCOUNTS_JSON }}' > config/accounts.json

          # Deploy persistent staging stack
          chmod +x deploy.sh
          ./deploy.sh --stack-tag ccp-staging --env staging

          # Get panel URL
          PANEL_URL=$(aws cloudformation describe-stacks \
            --stack-name "cloud-control-ccp-staging" \
            --query "Stacks[0].Outputs[?OutputKey=='ControlPanelUrl'].OutputValue" \
            --output text)
          echo "panel-url=${PANEL_URL}" >> "$GITHUB_OUTPUT"

      - name: Run health check on staging
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh \
            "${{ steps.deploy.outputs.panel-url }}" \
            "cloud-control-ccp-staging" \
            --region us-east-1 \
            --sns-topic "${{ secrets.SNS_NOTIFICATION_TOPIC }}"

      - name: Upload staging panel URL as artifact
        run: |
          mkdir -p staging-output
          echo "${{ steps.deploy.outputs.panel-url }}" > staging-output/panel-url.txt
          echo "Staging Panel URL: ${{ steps.deploy.outputs.panel-url }}"

      - name: Upload staging URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-panel-url
          path: staging-output/panel-url.txt
          retention-days: 90

  # ─── Manual Approval Gate: 72-hour expiry, environment-approver required ─

  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-approval
    steps:
      - name: Approval granted
        run: echo "Production deployment approved. Proceeding to deploy."

  # ─── Production: delete staging, deploy production after approval ─────

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: approve-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Delete staging stack
        run: |
          echo "🗑️ Deleting staging stack cloud-control-ccp-staging..."
          aws cloudformation delete-stack \
            --stack-name "cloud-control-ccp-staging" \
            --region us-east-1

          echo "⏳ Waiting for staging stack deletion to complete..."
          aws cloudformation wait stack-delete-complete \
            --stack-name "cloud-control-ccp-staging" \
            --region us-east-1 || true

          echo "✅ Staging stack deleted successfully"

      - name: Deploy to production
        id: prod-deploy
        run: |
          # Reconstruct accounts.json from secret
          echo '${{ secrets.ACCOUNTS_JSON }}' > config/accounts.json

          chmod +x deploy.sh
          ./deploy.sh --stack-tag ccp-main --env prod

          # Get production panel URL
          PANEL_URL=$(aws cloudformation describe-stacks \
            --stack-name "cloud-control-ccp-main" \
            --query "Stacks[0].Outputs[?OutputKey=='ControlPanelUrl'].OutputValue" \
            --output text)
          echo "panel-url=${PANEL_URL}" >> "$GITHUB_OUTPUT"

      - name: Run health check on production
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh \
            "${{ steps.prod-deploy.outputs.panel-url }}" \
            "cloud-control-ccp-main" \
            --region us-east-1 \
            --sns-topic "${{ secrets.SNS_NOTIFICATION_TOPIC }}"
